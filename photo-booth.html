<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Booth</title>
<style>
  :root{
    --curtain: #2B0A10;
    --curtain-deep: #170508;
    --paper: #EDE3D0;
    --ink: #241713;
    --cream: #F5ECDD;
    --flash: #E8A33D;
    --rose: #C9707B;
    --film: #14100E;
    --line: rgba(36,23,19,0.14);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--cream);
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.14) 0 2px, transparent 2px 42px),
      radial-gradient(ellipse at top, #4a1219 0%, var(--curtain) 55%, var(--curtain-deep) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }
  .stage{ width:100%; max-width:620px; }

  /* Marquee title */
  .marquee{
    position:relative;
    text-align:center;
    padding: 20px 10px 22px;
    margin-bottom: 22px;
  }
  .marquee::before, .marquee::after{
    content:'';
    position:absolute; left:6px; right:6px; height:10px;
    background-image: radial-gradient(circle, var(--flash) 3px, rgba(232,163,61,0.15) 3.6px, transparent 4px);
    background-size: 26px 10px;
    background-repeat: repeat-x;
  }
  .marquee::before{ top:0; }
  .marquee::after{ bottom:0; }
  .marquee h1{
    margin:0;
    font-family: "Arial Narrow", "Helvetica Neue Condensed", Arial, sans-serif;
    font-weight:900;
    font-size: clamp(34px, 7vw, 52px);
    letter-spacing: 0.12em;
    text-transform:uppercase;
    color: var(--cream);
    text-shadow: 0 0 18px rgba(232,163,61,0.35);
  }
  .marquee p{
    margin: 6px 0 0;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: rgba(245,236,221,0.6);
    text-transform: uppercase;
  }

  .panel{
    background: var(--paper);
    color: var(--ink);
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(36,23,19,0.06);
  }

  .screen{ display:none; }
  .screen.active{ display:block; }

  /* Intro screen */
  .field{ margin-bottom: 20px; }
  .field label{
    display:block; font-size: 12px; font-weight:700; letter-spacing:0.06em;
    text-transform:uppercase; color: rgba(36,23,19,0.65); margin-bottom:8px;
  }
  .field input[type="text"]{
    width:100%; padding: 12px 14px; border-radius:10px;
    border: 1.5px solid var(--line); background: #fff;
    font-size:15px; color: var(--ink); font-family:inherit;
  }
  .field input[type="text"]:focus{ outline: 2px solid var(--flash); outline-offset:1px; }

  .themes{ display:flex; gap:14px; }
  .theme-swatch{
    width:52px; height:52px; border-radius:50%;
    border: 3px solid transparent; cursor:pointer; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .theme-swatch:focus-visible{ outline: 2px solid var(--ink); outline-offset:2px; }
  .theme-swatch.selected{ border-color: var(--ink); }
  .theme-swatch.selected::after{
    content:'✓'; color:#fff; font-weight:900; font-size:18px; text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .theme-noir{ background: var(--film); }
  .theme-rose{ background: var(--rose); }
  .theme-marigold{ background: var(--flash); }

  .pills{ display:flex; gap:10px; flex-wrap:wrap; }
  .pill{
    padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--line);
    background: #fff; color: var(--ink); font-size:14px; font-weight:700;
    cursor:pointer; letter-spacing:0.02em;
  }
  .pill:hover{ background: rgba(36,23,19,0.05); }
  .pill:focus-visible{ outline: 2px solid var(--flash); outline-offset:2px; }
  .pill.selected{ background: var(--film); border-color: var(--film); color: var(--cream); }

  .hint{ font-size:13px; color: rgba(36,23,19,0.6); margin: 4px 0 24px; line-height:1.5; }

  button.primary{
    width:100%; padding: 16px; border:none; border-radius: 12px;
    background: var(--film); color: var(--cream);
    font-size:16px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase;
    cursor:pointer; transition: transform .15s ease, background .15s ease;
  }
  button.primary:hover{ background:#241a15; }
  button.primary:active{ transform: scale(0.98); }
  button.primary:focus-visible{ outline: 3px solid var(--flash); outline-offset:2px; }
  button.primary:disabled{ opacity:0.55; cursor:not-allowed; }

  .row-buttons{ display:flex; gap:12px; margin-top:14px; }
  .row-buttons button.secondary{
    flex:1; padding:14px; border-radius:12px; border: 1.5px solid var(--film);
    background: transparent; color: var(--ink); font-weight:700; letter-spacing:0.03em;
    cursor:pointer; font-size:14px;
  }
  .row-buttons button.secondary:hover{ background: rgba(36,23,19,0.06); }
  .row-buttons button.secondary:focus-visible{ outline: 2px solid var(--film); outline-offset:2px; }

  .error-box{
    background:#fff4ee; border:1.5px solid #d97757; color:#7a3419;
    padding:14px 16px; border-radius:10px; font-size:13.5px; line-height:1.5; margin-top:16px; display:none;
  }
  .error-box.show{ display:block; }

  /* Session screen */
  .camera-wrap{
    position:relative; width:100%; aspect-ratio: 4/3;
    background:#000; border-radius:12px; overflow:hidden;
    box-shadow: inset 0 0 0 6px var(--film);
  }
  video{ width:100%; height:100%; object-fit:cover; transform: scaleX(-1); display:block; }
  .shot-label{
    position:absolute; top:14px; left:0; right:0; text-align:center;
    font-size:12px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700;
    color:#fff; text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .countdown-num{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family: "Courier New", monospace; font-weight:700;
    font-size: 120px; color:#fff; text-shadow: 0 0 24px rgba(0,0,0,0.7);
    pointer-events:none;
  }
  .flash-overlay{
    position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;
  }
  .flash-overlay.flashing{ animation: flashpop 380ms ease-out; }
  @keyframes flashpop{ 0%{opacity:0.95;} 100%{opacity:0;} }

  .permission-note{
    text-align:center; font-size:13px; color: rgba(36,23,19,0.6); margin-top:14px; line-height:1.5;
  }

  /* Result screen */
  .strip-preview{ text-align:center; }
  .strip-preview img{
    max-width: 320px; width:100%; border-radius:10px; box-shadow: 0 12px 30px rgba(0,0,0,0.3);
  }

  @media (max-width: 420px){
    .panel{ padding:20px; }
    .countdown-num{ font-size:90px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="marquee">
    <h1>Photo Booth</h1>
    <p>Senyum, 3 jepretan, langsung jadi</p>
  </div>

  <div class="panel">

    <!-- INTRO -->
    <section class="screen active" id="screen-intro">
      <div class="field">
        <label for="caption-input">Caption strip (opsional)</label>
        <input type="text" id="caption-input" placeholder="PHOTO BOOTH" maxlength="30">
      </div>

      <div class="field">
        <label>Warna border strip</label>
        <div class="themes">
          <button type="button" class="theme-swatch theme-noir selected" data-theme="noir" aria-label="Border hitam klasik"></button>
          <button type="button" class="theme-swatch theme-rose" data-theme="rose" aria-label="Border rose"></button>
          <button type="button" class="theme-swatch theme-marigold" data-theme="marigold" aria-label="Border marigold"></button>
        </div>
      </div>

      <div class="field">
        <label>Filter foto</label>
        <div class="pills" id="filter-pills">
          <button type="button" class="pill selected" data-filter="normal">Normal</button>
          <button type="button" class="pill" data-filter="bw">B&amp;W</button>
          <button type="button" class="pill" data-filter="vintage">Vintage</button>
        </div>
      </div>

      <div class="field">
        <label>Jumlah foto per strip</label>
        <div class="pills" id="count-pills">
          <button type="button" class="pill selected" data-count="3">3 Foto</button>
          <button type="button" class="pill" data-count="4">4 Foto</button>
        </div>
      </div>

      <p class="hint" id="session-hint">3 foto akan diambil otomatis, masing-masing dengan hitungan mundur 3 detik. Pastikan browser mengizinkan akses kamera ya.</p>

      <button class="primary" id="btn-start">Mulai Sesi Foto</button>
      <div class="error-box" id="error-box"></div>
    </section>

    <!-- SESSION -->
    <section class="screen" id="screen-session">
      <div class="camera-wrap">
        <video id="video" autoplay playsinline muted></video>
        <div class="shot-label" id="shot-label">Foto 1 dari 3</div>
        <div class="countdown-num" id="countdown-num"></div>
        <div class="flash-overlay" id="flash-overlay"></div>
      </div>
      <p class="permission-note" id="session-note">Bersiap...</p>
    </section>

    <!-- RESULT -->
    <section class="screen" id="screen-result">
      <div class="strip-preview">
        <img id="result-img" alt="Hasil photo booth strip">
      </div>
      <div class="row-buttons">
        <button class="secondary" id="btn-retake">Ambil Ulang</button>
        <button class="secondary" id="btn-share">Bagikan</button>
      </div>
      <button class="primary" id="btn-download" style="margin-top:12px;">Download Strip</button>
    </section>

  </div>
</div>

<script>
(function(){
  const THEMES = {
    noir:     { bg: "#14100E", text: "#EDE3D0", hole: "rgba(255,255,255,0.14)" },
    rose:     { bg: "#C9707B", text: "#2B0A10", hole: "rgba(0,0,0,0.14)" },
    marigold: { bg: "#E8A33D", text: "#2B0A10", hole: "rgba(0,0,0,0.14)" }
  };

  const screens = {
    intro: document.getElementById('screen-intro'),
    session: document.getElementById('screen-session'),
    result: document.getElementById('screen-result')
  };
  const FILTERS = {
    normal:  '',
    bw:      'grayscale(1) contrast(1.08)',
    vintage: 'sepia(0.5) saturate(1.3) contrast(0.92) brightness(1.06)'
  };

  const captionInput = document.getElementById('caption-input');
  const themeButtons = document.querySelectorAll('.theme-swatch');
  const filterButtons = document.querySelectorAll('#filter-pills .pill');
  const countButtons = document.querySelectorAll('#count-pills .pill');
  const sessionHint = document.getElementById('session-hint');
  const btnStart = document.getElementById('btn-start');
  const errorBox = document.getElementById('error-box');
  const video = document.getElementById('video');
  const shotLabel = document.getElementById('shot-label');
  const countdownNum = document.getElementById('countdown-num');
  const flashOverlay = document.getElementById('flash-overlay');
  const sessionNote = document.getElementById('session-note');
  const resultImg = document.getElementById('result-img');
  const btnRetake = document.getElementById('btn-retake');
  const btnShare = document.getElementById('btn-share');
  const btnDownload = document.getElementById('btn-download');

  let selectedTheme = 'noir';
  let selectedFilter = 'normal';
  let shotCount = 3;
  let stream = null;
  let shots = [];
  let finalCanvas = null;

  themeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      themeButtons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedTheme = btn.dataset.theme;
    });
  });

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedFilter = btn.dataset.filter;
      video.style.filter = FILTERS[selectedFilter];
    });
  });

  countButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      countButtons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      shotCount = parseInt(btn.dataset.count, 10);
      sessionHint.textContent = `${shotCount} foto akan diambil otomatis, masing-masing dengan hitungan mundur 3 detik. Pastikan browser mengizinkan akses kamera ya.`;
    });
  });

  function showScreen(name){
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }

  async function startSession(){
    errorBox.classList.remove('show');
    btnStart.disabled = true;
    btnStart.textContent = 'Meminta izin kamera...';
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
        audio: false
      });
    }catch(err){
      btnStart.disabled = false;
      btnStart.textContent = 'Mulai Sesi Foto';
      showError('Tidak bisa mengakses kamera. Pastikan kamu mengizinkan akses kamera di browser. Kalau masih gagal, coba download file ini dan buka langsung di browser (bukan lewat preview).');
      return;
    }
    btnStart.disabled = false;
    btnStart.textContent = 'Mulai Sesi Foto';

    video.srcObject = stream;
    video.style.filter = FILTERS[selectedFilter];
    try{ await video.play(); }catch(e){ /* some browsers auto-play already */ }
    if(video.readyState < 2){
      await new Promise(resolve => { video.onloadedmetadata = () => resolve(); });
    }
    shots = [];
    showScreen('session');
    sessionNote.textContent = 'Bersiap...';

    for(let i = 1; i <= shotCount; i++){
      shotLabel.textContent = `Foto ${i} dari ${shotCount}`;
      await runCountdown();
      captureShot();
      triggerFlash();
      sessionNote.textContent = i < shotCount ? 'Siap-siap foto berikutnya...' : 'Selesai! Menyusun strip...';
      if(i < shotCount) await sleep(1000);
    }

    stream.getTracks().forEach(t => t.stop());
    await sleep(400);
    composeStrip();
    showScreen('result');
  }

  async function runCountdown(){
    for(const n of [3,2,1]){
      countdownNum.textContent = n;
      await sleep(1000);
    }
    countdownNum.textContent = '';
  }

  function triggerFlash(){
    flashOverlay.classList.remove('flashing');
    void flashOverlay.offsetWidth;
    flashOverlay.classList.add('flashing');
  }

  function captureShot(){
    const targetW = 480, targetH = 360;
    const vw = video.videoWidth, vh = video.videoHeight;
    const targetAspect = targetW / targetH;
    const srcAspect = vw / vh;
    let sx, sy, sw, sh;
    if(srcAspect > targetAspect){
      sh = vh; sw = vh * targetAspect; sx = (vw - sw) / 2; sy = 0;
    }else{
      sw = vw; sh = vw / targetAspect; sx = 0; sy = (vh - sh) / 2;
    }
    const c = document.createElement('canvas');
    c.width = targetW; c.height = targetH;
    const ctx = c.getContext('2d');
    ctx.save();
    ctx.translate(targetW, 0);
    ctx.scale(-1, 1);
    try{ ctx.filter = FILTERS[selectedFilter] || 'none'; }catch(e){}
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, targetW, targetH);
    ctx.restore();
    shots.push(c);
  }

  function roundRectPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function composeStrip(){
    const theme = THEMES[selectedTheme];
    const PAD = 45, GAP = 20, PHOTO_W = 610, PHOTO_H = 458, FOOTER_H = 140;
    const STRIP_W = PHOTO_W + PAD * 2;
    const STRIP_H = PAD + PHOTO_H * shotCount + GAP * (shotCount - 1) + FOOTER_H + PAD;

    const canvas = document.createElement('canvas');
    canvas.width = STRIP_W;
    canvas.height = STRIP_H;
    const ctx = canvas.getContext('2d');

    // background
    roundRectPath(ctx, 0, 0, STRIP_W, STRIP_H, 24);
    ctx.fillStyle = theme.bg;
    ctx.fill();

    // sprocket holes
    ctx.fillStyle = theme.hole;
    const holeStartY = 70, holeEndY = PAD + PHOTO_H * shotCount + GAP * (shotCount - 1) - 30;
    for(let y = holeStartY; y < holeEndY; y += 34){
      ctx.beginPath(); ctx.arc(22, y, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(STRIP_W - 22, y, 5, 0, Math.PI * 2); ctx.fill();
    }

    // photos
    shots.forEach((shotCanvas, i) => {
      const x = PAD;
      const y = PAD + i * (PHOTO_H + GAP);
      ctx.save();
      roundRectPath(ctx, x, y, PHOTO_W, PHOTO_H, 8);
      ctx.clip();
      ctx.drawImage(shotCanvas, 0, 0, shotCanvas.width, shotCanvas.height, x, y, PHOTO_W, PHOTO_H);
      ctx.restore();
    });

    // footer text
    const footerY = PAD + PHOTO_H * shotCount + GAP * (shotCount - 1);
    const caption = (captionInput.value || 'PHOTO BOOTH').toUpperCase();
    const now = new Date();
    const dateStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' }) +
                    ' · ' + now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

    ctx.fillStyle = theme.text;
    ctx.textAlign = 'center';
    try{ ctx.letterSpacing = '2px'; }catch(e){}
    ctx.font = "900 32px 'Arial Narrow', Arial, sans-serif";
    ctx.fillText(caption, STRIP_W / 2, footerY + 58, STRIP_W - PAD * 2);

    try{ ctx.letterSpacing = '1px'; }catch(e){}
    ctx.font = "16px 'Courier New', monospace";
    ctx.globalAlpha = 0.75;
    ctx.fillText(dateStr, STRIP_W / 2, footerY + 90);
    ctx.globalAlpha = 1;

    finalCanvas = canvas;
    resultImg.src = canvas.toDataURL('image/png');
  }

  function downloadStrip(){
    if(!finalCanvas) return;
    const link = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g, '-');
    link.download = `photobooth-strip-${ts}.png`;
    link.href = finalCanvas.toDataURL('image/png');
    link.click();
  }

  async function shareStrip(){
    if(!finalCanvas) return;
    try{
      const blob = await new Promise(resolve => finalCanvas.toBlob(resolve, 'image/png'));
      const file = new File([blob], 'photobooth-strip.png', { type: 'image/png' });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({
          files: [file],
          title: 'Photo Booth',
          text: captionInput.value || 'Photo Booth'
        });
        return;
      }
    }catch(e){ /* fall through to fallback */ }
    downloadStrip();
    alert('Fitur bagikan langsung belum didukung browser ini — strip sudah didownload, silakan bagikan manual ya.');
  }

  function resetToIntro(){
    shots = [];
    finalCanvas = null;
    showScreen('intro');
  }

  btnStart.addEventListener('click', startSession);
  btnRetake.addEventListener('click', resetToIntro);
  btnDownload.addEventListener('click', downloadStrip);
  btnShare.addEventListener('click', shareStrip);
})();
</script>
</body>
</html>
